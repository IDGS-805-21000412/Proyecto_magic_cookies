<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de ventas</title>
    <link rel="stylesheet" href="../../static/css/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    {% from "macros.html" import macros %}
    {{ macros() }}

    <main>
        <h1>Historial de ventas</h1>
        <br>
        <br>
        <div id="flowbite-form-container"></div>       
    </main>

    <script>
        const container = document.getElementById('flowbite-form-container');
        const shadow = container.attachShadow({ mode: 'open' });

        shadow.innerHTML = `
           <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet">
                <style>
                    .form-container {
                        margin-top: 5%; 
                    }
                    
                    .form-title {
                        text-align: center;
                        font-size: 1.5rem;
                        font-weight: bold;
                        margin-bottom: 1.5rem;
                        color: #1a365d; 
                    }
                    
                    .cantidad-container {
                        display: flex;
                        align-items: flex-end;
                        gap: 1rem;
                    }
                    
                    .agregar-container {
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                        cursor: pointer;
                    }
                    .agregar-container svg {
                        width: 24px;
                        height: 24px;
                        color: black; 
                    }
                    .agregar-container span {
                        font-size: 0.875rem; 
                        color: black; 
                    }
                    
                    .search-container {
                        display: flex;
                        justify-content: flex-end;
                        margin-bottom: 1rem;
                    }
                </style>
                {% if ventas_detalles %}
                <div class="table-container max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-md mt-8">  
                    <table id="tabla-venta" class="w-full text-sm text-left text-gray-900">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 border-b">Fecha</th>
                                <th class="px-4 py-2 border-b">Producto</th>
                                <th class="px-4 py-2 border-b">Presentación</th>
                                <th class="px-4 py-2 border-b">Cantidad</th>
                                <th class="px-4 py-2 border-b">Precio</th>
                                <th class="px-4 py-2 border-b">Subtotal</th>
                                <th class="px-4 py-2 border-b">  </th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for venta_detalle in ventas_detalles %}
                                <!-- Mostrar solo una fila por venta -->
                                <tr>
                                    <td colspan="7" class="bg-gray-200 font-bold">{{ venta_detalle['venta'].fecha }} </td>
                                </tr>

                                <!-- Mostrar los productos de la venta -->
                                {% for detalle in venta_detalle['detalles'] %}
                                    <tr>
                                        <td></td>
                                        <td>{{ detalle.producto.nombre }}</td>
                                        <td>{{ detalle.producto.tipo }}</td>
                                        <td>{{ detalle.cantidad }}</td>
                                        <td>{{ detalle.producto.precio }}</td>
                                        <td>{{ detalle.subtotal }}</td>
                                    </tr>
                                {% endfor %}

                                <!-- Mostrar el total de la venta solo una vez -->
                                <tr>
                                    <td colspan="6" class="text-right font-bold">Total:</td>
                                    <td>{{ venta_detalle['total'] }}</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>                    
                </div>
                {% else %}
                <p>No hay ventas para mostrar.</p>
                {% endif %}
        `;
    </script>

    <script src="../../static/js/scripts.js"></script>
</body>
</html>
