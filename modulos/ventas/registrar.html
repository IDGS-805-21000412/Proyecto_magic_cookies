<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <link rel="stylesheet" href="../../static/css/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    {% from "macros.html" import macros %}
    {{ macros() }}

    <main>
        <h1>Ventas</h1>
        <br>
        <br>
        <div id="flowbite-form-container"></div>
        <div id="flowbite-table-container"></div>
    </main>

    <script>
        const container = document.getElementById('flowbite-form-container');
        const shadow = container.attachShadow({ mode: 'open' });

        shadow.innerHTML = `
            <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet">
            <style>
                .form-container {
                    margin-top: 5%; 
                }
                
                .form-title {
                    text-align: center;
                    font-size: 1.5rem;
                    font-weight: bold;
                    margin-bottom: 1.5rem;
                    color: #1a365d; 
                }
                
                .cantidad-container {
                    display: flex;
                    align-items: flex-end;
                    gap: 1rem;
                }
                
                .agregar-container {
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                    cursor: pointer;
                }
                .agregar-container svg {
                    width: 24px;
                    height: 24px;
                    color: black; 
                }
                .agregar-container span {
                    font-size: 0.875rem; 
                    color: black; 
                }
                
                .search-container {
                    display: flex;
                    justify-content: flex-end;
                    margin-bottom: 1rem;
                }
                
            </style>
        <div class="form-container max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 class="form-title">Nueva venta</h2>   
        <center><div class="messages"></div> </center>
        <br>
       <form id="venta-form" method="POST">
            {{ form.hidden_tag() }}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="grid grid-cols-5 gap-6 mb-5">
                <div class="relative z-0 w-full group">
                    <select name="producto" id="producto" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" required>
                        {% for producto in form.producto.choices %}
                            <option value="{{ producto[0] }}">{{ producto[1] }}</option>
                        {% endfor %}
                    </select>
                    <label for="producto" class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Producto</label>
                </div>
                <div class="relative z-0 w-full group">
                    <select name="tipo" id="tipo" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" required>                        
                        <option value="Piezas" selected>Piezas</option>
                        <option value="Pre-empacada 700 gr">Pre-empacada 700 gr</option>
                        <option value="Pre-empacada 1Kg">Pre-empacada 1Kg</option>
                        <option value="Gramos">Gramos</option>
                    </select>
                    <label for="tipo" class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Presentación</label>
                </div>
                <div class="relative z-0 w-full group">
                    <input type="number" name="cantidad" id="cantidad" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required step="0.01" min="1" />
                    <label for="cantidad" class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Cantidad</label>
                </div>                                                         

            </div>

            <div class="flex gap-4">                                 
                <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Añadir</button>
            </div>
        </form>
    </div>
        `;                
        document.addEventListener("DOMContentLoaded", function() {
            const ventasUrl = "{{ url_for('ventas') }}"; // Asignar la URL a una variable
            const messagesContainer = shadow.querySelector('.messages');
        
            // Array para almacenar los productos seleccionados
            let productosSeleccionados = [];
        
            // Función para manejar el formulario
            const handleFormSubmit = (e) => {
                e.preventDefault(); // Evitar la recarga de la página
                const form = shadow.querySelector('form');
                const formData = new FormData(form); // Obtener los datos del formulario
        
                fetch(ventasUrl, {  // Usar la variable en lugar de {{ url_for('ventas') }}
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    // Mostrar mensaje de éxito o error
                    const alertDiv = document.createElement('div');
                    alertDiv.className = `alert alert-${data.status === 'success' ? 'success' : 'danger'}`;
                    alertDiv.textContent = data.message;
        
                    messagesContainer.innerHTML = ''; // Limpiar mensajes anteriores
                    messagesContainer.appendChild(alertDiv);
        
                    // Si la respuesta es exitosa, agregar el producto a la tabla
                    if (data.status === 'success') {
                        addProductToTable(data.producto);
                    }
                })
                .catch(error => {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-danger';
                    alertDiv.textContent = `Error: ${error}`;
        
                    messagesContainer.innerHTML = ''; // Limpiar mensajes anteriores
                    messagesContainer.appendChild(alertDiv);
                });
            };
        
            // Función para agregar producto a la tabla y mostrar JSON
            const addProductToTable = (producto) => {
                // Agregar el producto al array de productos seleccionados
                productosSeleccionados.push({
                    idProducto: producto.idProducto,
                    nombre: producto.nombre,
                    tipo: producto.tipo,
                    cantidad: producto.cantidad,
                    precio: producto.precio,
                    subtotal: producto.subtotal
                });
        
                // Mostrar el JSON en la consola cada vez que se agregue un nuevo producto
                console.log(JSON.stringify(productosSeleccionados, null, 2));
        
                const tablaVenta = document.getElementById('tabla-venta').getElementsByTagName('tbody')[0];
                const nuevaFila = tablaVenta.insertRow();
                nuevaFila.innerHTML = `
                    <td class="px-4 py-2 border-b border-gray-300">${producto.nombre}</td>
                    <td class="px-4 py-2 border-b border-gray-300">${producto.tipo}</td>
                    <td class="px-4 py-2 border-b border-gray-300">${producto.cantidad}</td>
                    <td class="px-4 py-2 border-b border-gray-300">${producto.precio}</td>
                    <td class="px-4 py-2 border-b border-gray-300">${producto.subtotal}</td>
                `;
            };
        
            // Agregar el evento al formulario
            const form = shadow.querySelector('form');
            form.addEventListener('submit', handleFormSubmit);
            
            // Agregar tabla para mostrar productos
            const tableContainer = document.getElementById('flowbite-table-container');
            tableContainer.innerHTML = `
                <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet">
                <style>
                    .form-container {
                        margin-top: 5%; 
                    }
                    
                    .form-title {
                        text-align: center;
                        font-size: 1.5rem;
                        font-weight: bold;
                        margin-bottom: 1.5rem;
                        color: #1a365d; 
                    }
                    
                    .cantidad-container {
                        display: flex;
                        align-items: flex-end;
                        gap: 1rem;
                    }
                    
                    .agregar-container {
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                        cursor: pointer;
                    }
                    .agregar-container svg {
                        width: 24px;
                        height: 24px;
                        color: black; 
                    }
                    .agregar-container span {
                        font-size: 0.875rem; 
                        color: black; 
                    }
                    
                    .search-container {
                        display: flex;
                        justify-content: flex-end;
                        margin-bottom: 1rem;
                    }
                </style>
                <div class="table-container max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-md mt-8">  
                    <table id="tabla-venta" class="w-full text-sm text-left text-gray-900">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 border-b">Producto</th>
                                <th class="px-4 py-2 border-b">Presentación</th>
                                <th class="px-4 py-2 border-b">Cantidad</th>
                                <th class="px-4 py-2 border-b">Precio</th>
                                <th class="px-4 py-2 border-b">Subtotal</th>                    
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Aquí se agregarán las filas -->
                        </tbody>
                    </table>
                
                    
                    <div class="flex justify-between gap-4">                                        
                        <!-- Botón Cancelar (Rojo) -->
                        <button type="button" id="cancelar-btn" class="text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-800">
                            Cancelar
                        </button>

                        <!-- Botón Finalizar (Verde) -->
                        <button type="button" id="finalizar-btn" class="text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
                            Finalizar
                        </button>
                    </div> 
             
                </div>
            `;
            document.getElementById('cancelar-btn').addEventListener('click', function() {
                const csrfToken = shadow.querySelector('input[name="csrf_token"]').value; // Asegúrate de que esté bien referenciado
            
                fetch("{{ url_for('cancelar') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken  // Enviar el token CSRF en la cabecera
                    }
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data);  // Asegúrate de que ves la respuesta en la consola
                    if (data.status === 'success') {
                        // Lógica para actualizar la interfaz si la cancelación fue exitosa
                        productosSeleccionados = [];  // Limpiar la lista de productos
                        // También puedes actualizar la interfaz (por ejemplo, borrar la tabla)
                        const tableBody = document.querySelector('#tabla-venta tbody');
                        tableBody.innerHTML = ''; // Limpiar filas de la tabla
                    }
                })
                .catch(error => {
                    console.error('Error:', error);  // Verifica si hay algún error en la consola
                });
            });
            
            document.getElementById('finalizar-btn').addEventListener('click', function() {
                const csrfToken = shadow.querySelector('input[name="csrf_token"]').value;
                const messagesContainer = shadow.querySelector('.messages');
            
                fetch("{{ url_for('finalizar') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        window.location.href = data.redirect_url; // Redirige directamente
                    } else {
                        messagesContainer.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    messagesContainer.innerHTML = '<div class="alert alert-danger">Ocurrió un error al finalizar la venta.</div>';
                });
            });
            
              
        });
        
    </script>

    <script src="../../static/js/scripts.js"></script>
</body>
</html>
