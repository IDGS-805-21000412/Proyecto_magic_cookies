<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket</title>
    <link rel="stylesheet" href="../../static/css/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    {% from "macros.html" import macros %}
    {{ macros() }}

    <main>
        <h1>Ticket</h1>
        <div id="flowbite-form-container"></div>       
    </main>

    <script>
        const container = document.getElementById('flowbite-form-container');
        const shadow = container.attachShadow({ mode: 'open' });

        shadow.innerHTML = `
           <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet">
                <style>
                    .form-container {
                        margin-top: 5%; 
                    }
                    
                    .form-title {
                        text-align: center;
                        font-size: 1.5rem;
                        font-weight: bold;
                        margin-bottom: 1.5rem;
                        color: #1a365d; 
                    }
                    
                    .cantidad-container {
                        display: flex;
                        align-items: flex-end;
                        gap: 1rem;
                    }
                    
                    .agregar-container {
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                        cursor: pointer;
                    }
                    .agregar-container svg {
                        width: 24px;
                        height: 24px;
                        color: black; 
                    }
                    .agregar-container span {
                        font-size: 0.875rem; 
                        color: black; 
                    }
                    
                    .search-container {
                        display: flex;
                        justify-content: flex-end;
                        margin-bottom: 1rem;
                    }
                </style>
                {% if productos %}
                <div class="table-container max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-md mt-8">  
                    <table id="tabla-venta" class="w-full text-sm text-left text-gray-900">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 border-b">Producto</th>
                                <th class="px-4 py-2 border-b">Presentación</th>
                                <th class="px-4 py-2 border-b">Cantidad</th>
                                <th class="px-4 py-2 border-b">Precio</th>
                                <th class="px-4 py-2 border-b">Subtotal</th>                    
                            </tr>
                        </thead>
                        <tbody>
                            {% for producto in productos %}
                            <tr>
                                <td>{{ producto.get('nombre', 'Sin nombre') }}</td>
                                <td>{{ producto.get('tipo', 'Sin tipo') }}</td>
                                <td>{{ producto.get('cantidad', 0) }}</td>
                                <td>{{ producto.get('precio', 0.0) }}</td>
                                <td>{{ producto.get('subtotal', 0.0) }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>                     
                    <table id="tabla-total" class="w-full text-sm text-left text-gray-900">
                        <thead class="bg-gray-100">
                            <tr>                                
                                <th class="px-4 py-2 border-b">Total: {{ total }}</th>                    
                            </tr>
                        </thead>                        
                    </table>
                   
                    
                    <div class="flex justify-between gap-4">                                                                
                        <!-- Botón Volver (Verde) -->
                        <button type="button" id="volver-btn" class="text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
                            Volver
                        </button>
                    </div> 
             
                </div>
                 {% else %}
                <p>No hay productos para mostrar.</p>
                {% endif %}
        `;                
        document.addEventListener("DOMContentLoaded", function() {
            const shadow = document.getElementById('flowbite-form-container').shadowRoot; // Accede al shadowRoot
        
            // Espera a que el contenido esté listo en el shadow DOM
            shadow.querySelector('#volver-btn').addEventListener('click', function() {
                fetch("{{ url_for('volver') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': "{{ csrf_token() }}" 
                    }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = "{{ url_for('ventas') }}";
                    }
                })
                .catch(error => console.error('Error:', error));
            });
        });
        
    </script>

    <script src="../../static/js/scripts.js"></script>
</body>
</html>
